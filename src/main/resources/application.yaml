spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health, info
