# Local development stack only. Credentials below are throwaway values for this environment.
services:
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=notifications'
      - 'POSTGRES_USER=notifications'
      - 'POSTGRES_PASSWORD=notifications'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 5s
      retries: 10

  kafka:
    image: 'apache/kafka-native:4.4.0'
    ports:
      - '9092:9092'

  grafana-lgtm:
    image: 'grafana/otel-lgtm:0.38.1'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
    # Dashboard and alert rules are provisioned as files; each mount adds one file to the image's own directories.
    volumes:
      - './docker/grafana/provisioning/dashboards/notification-delivery.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/notification-delivery.yaml:ro'
      - './docker/grafana/provisioning/alerting/notification-delivery-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/notification-delivery-alerts.yaml:ro'
      - './docker/grafana/dashboards:/var/lib/cobre/dashboards:ro'
